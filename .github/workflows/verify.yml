name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      # The team-string check needs the list of a team's own names, which never ships in the
      # repo. Put them in a TEAM_STRINGS secret, one per line, and this step writes the gitignored
      # file verify.py reads — masking every line first, so a match never prints a name into a
      # public log. Without the secret the check is skipped, and verify says so.
      - name: Team strings (from the TEAM_STRINGS secret, when set)
        if: env.TEAM_STRINGS != ''
        env:
          TEAM_STRINGS: ${{ secrets.TEAM_STRINGS }}
        run: |
          printf '%s\n' "$TEAM_STRINGS" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::${line#!}"
          done
          printf '%s\n' "$TEAM_STRINGS" > tools/team-strings.local.txt
      - name: Repository consistency
        run: python3 tools/verify.py
      - name: Figma sandbox script syntax
        run: bash plugins/fig/_common/scripts/lib/check.sh
      - name: Arrow geometry fixtures
        run: node --test tools/test/audit-flow.test.js
      - name: Config resolution fixtures
        run: python3 tools/test/resolve-config.test.py
      - name: Adapter lookup fixtures
        run: python3 tools/test/adapter.test.py
      - name: Starter conventions fixtures
        run: python3 tools/test/starter-conventions.test.py
      - name: Preflight fixtures
        run: python3 tools/test/preflight.test.py
      - name: Draft generator fixtures
        run: python3 tools/test/draft-conventions.test.py
      - name: Notion export importer fixtures
        run: node --test plugins/pm/_common/scripts/import-notion-export.test.mjs
