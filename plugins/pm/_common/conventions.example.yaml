# =============================================================================
# pm-conventions.yaml — shared config for the pm skills
#
# This file is the single source of truth for the rules. Skill bodies carry
# judgement, never values.
#
# The layers are merged, each overriding the one above. Write only the keys
# you need — anything you leave out falls back to the layer above.
#   1. this file                       bundled defaults (base)
#   2. ~/.claude/pm-conventions.yaml   your shared config
#   3. ./pm-conventions.yaml           per project (wins)
#
# When you don't know a value, write null rather than deleting the key — null
# means "skip that", while deleting brings the default back.
# =============================================================================

meta:
  profile: default          # name stamped on reports, so you know which config ran
  language: auto            # document and report language — auto | en | ko | any BCP-47 tag.
                            # auto follows the language you are talking in

# --- PRD -----------------------------------------------------------------------
prd:
  # Where the document lives. The structure below is identical either way;
  # only publishing differs.
  #   markdown  local files. the default — needs no other tooling
  #   git       writes markdown, then a branch and a PR
  #   notion    Notion pages. requires the notion section to be filled in
  target: markdown

  # --- Structure. The same wherever the doc is published -------------------------
  structure:
    sections: [Overview, Requirements, Linked tasks, Design, Change log]
    overview: [One-line definition, Background, Core value, Goals and scope, User groups]

    # Rows written for each user group. Leave a row as TBD rather than filling
    # it in without evidence.
    user_group_rows: [Account and access, Environment, Primary domains, Key scenario,
                      Pain points, Expectations, Evidence, TBD]

    # Sections inside a feature entry. Behaviour goes in a table (action, given, when, then).
    feature_sections: [Background, Core requirement, Behaviour, States and cases, Rules and exceptions, References]
    policy_sections:  [Background, Rules, References]

    # Fixed rows of the states table. Use '—' when a row does not apply,
    # 'Other' for anything outside the list.
    cases: [Normal, Empty, Loading, Error, No permission]

  # --- Entry properties. Use the words your team actually uses --------------------
  properties:
    type:     [Feature, Policy]
    status:   [Draft, Live, Needs update, Planned, Archived]
    priority: [Core, Important, Nice-to-have]

  # --- Writing rules -------------------------------------------------------------
  # The list that keeps a product doc from turning into an engineering doc.
  # Anything here appearing in the body is rejected at verification. The rule
  # behind it: write *what* is required, and leave *how* to engineering.
  forbidden_terms: [API, endpoint, websocket, polling, payload, token, JWT, OAuth,
                    schema, migration, cache]
  # Only for what genuinely cannot be settled. Attaching this to something the
  # material could have decided fails verification.
  tbd_label:        "TBD"
  assumption_label: "(assumed)"
  emoji:            false        # whether emoji are allowed in the body

  # --- Splitting into domains ----------------------------------------------------
  domains:
    range: [5, 7]                # how many to aim for. they must not overlap
    align_with_design: true      # whether to match the design file's page structure one to one

  # --- target: markdown | git ----------------------------------------------------
  markdown:
    dir: "./docs/prd"            # where documents go
    front_matter: true           # whether to prepend title, status and updated date
    split: product               # product = one file per product / domain = one per domain
  git:
    branch_prefix: "prd/"        # branch prefix when target is git
    open_pr: true

  # --- target: notion ------------------------------------------------------------
  # null skips that lookup or link. Inline database schemas are not changed per document.
  notion:
    template:      null          # page id of the standard format to duplicate
    inline_db:
      users:       null          # user groups
      features:    null          # features and policies
    task_db:       null          # linked tasks
    heading_style: '{color="gray_bg"}'
    reference_docs: []           # existing docs to follow for tone and format

# --- Sources -------------------------------------------------------------------
# Draft quality scales with how much material goes in. Turn off what you don't use.
sources:
  design: true                   # design files
  repo:   true                   # code and design documents
  docs:   true                   # document tools such as Notion
  chat:   true                   # chat history
  # Which tool each of these is. The calls live in sources/<type>.md — slack and
  # google ship; any other name needs an adapter you draft (see adapters below).
  chat_type:     slack           # the chat tool /pm:task-draft and /pm:log read. none skips chat
  calendar_type: google          # the calendar /pm:log reads. none skips it

# --- Adapters ------------------------------------------------------------------
# The calls for one tool live in one file, named by the type the config uses —
# trackers/<type>.md for a task tracker, sources/<type>.md for chat or a calendar.
# The bundled ones ship inside the plugin. Yours live outside it, so an update does
# not overwrite them; later dirs cover earlier, like the config layers. /pm:setup
# drafts one for a tool it has never seen, from the tools connected on this machine.
adapters:
  dirs: ["~/.claude/pm-adapters", "./pm-adapters"]

# --- Tasks (/pm:task-draft, /pm:task-publish, /pm:task-sync) --------------------
# A task can live in one place or two. Teams that plan in one tool and build in
# another keep both; a single-tracker team sets `mirror.type: none` and the sync
# skill has nothing to reconcile, which is the correct answer rather than an error.
task:
  record:                        # where the planning-side task lives
    type: notion                 # notion | github | markdown | none
    ref:  null                   # a collection:// url, an owner/repo, or a directory
  mirror:                        # the engineering-side copy, if there is one
    type: none                   # github | notion | none
    ref:  null

  # The single source of truth for matching the two sides. Name the property on the
  # record that holds the mirror's url. A back-link written in the mirror's body is
  # NOT used — it can point at a source that was already discarded, which is how
  # duplicates and resurrected tickets happen.
  link_property: null

  # --- The context table written into a task record ------------------------------
  # Rename these to whatever your team actually asks. Order is the order written.
  context_rows: [Request source, Initial request, Background (AS-IS),
                 Goal (TO-BE), Scope In, Scope Out, Undecided]

  # A context table is scanned, not read. These keep the cells from turning into prose.
  cell:
    max_chars:    30             # roughly one line per item
    owner_marker: "—"            # how an owner is appended, e.g. "confirm — engineering"
    bullet:       "·"

  labels:
    assumption: "(assumed)"      # marks your inference, so it never reads as a found fact
    tbd:        "TBD"            # marks what nobody has decided yet

  # --- Record properties. Use the words your tracker uses ------------------------
  properties:
    status_initial: null         # the status a new record starts in
    priority: [low, medium, high, critical]
    projects: []                 # select options; empty means ask each time
    default_assignee: null       # id of whoever owns a task by default

  # Record status -> the mirror column a task is seated in when it is first filed.
  # Only the statuses a task can be filed *in* need an entry; a status with none leaves
  # the mirror's own default alone. This also tells /pm:task-sync which column counts as
  # the backlog. Seating is not ownership — field_owner.status still decides who wins later.
  status_map: {}

  # --- How a task sits under something bigger in the mirror ----------------------
  # null parent_kind means a flat list, which is the common case.
  hierarchy:
    parent_kind:   null          # Epic, Project, Milestone — whatever your tracker calls it
    parent_title:  null          # e.g. "[EPIC] [{group}] {name}"
    milestone_on:  none          # parent | task | none — which level carries a milestone
    milestone_format: null       # e.g. "{project} YYYY-MM"
    milestone_projects: []       # projects that use milestones; empty means none do

  # --- Which side wins, per field ------------------------------------------------
  # Sync never guesses. A field not listed here is reported as a difference and left alone.
  field_owner:
    title:    record
    status:   mirror
    assignee: record

  # --- Mapping between the two sides ---------------------------------------------
  # Left is what the record says, right is what the mirror calls it. A record value
  # with no entry here is NOT mirrored — the skill stops and says so rather than
  # inventing a label, because a wrong label is harder to find than a missing ticket.
  label_map:
    project:  {}                 # record project -> mirror label
    priority: {}                 # record priority -> mirror label
  assignee_map: {}               # record user id -> mirror username

  # --- The ticket written in the mirror ------------------------------------------
  # The detail stays in the record. The ticket carries a summary and links, so there
  # is one place to edit and no second copy to drift.
  ticket:
    title: "[Task] [{group}] {name}"
    default_labels: []           # labels every task gets, e.g. a type label
    sections: [Project and version, Summary, Links, Definition of done, Schedule]
    link_rows:                   # what appears under Links. null drops that row
      spec:   "Spec"
      design: "Design"
      record: "Change summary"

  # --- Whatever your tracker needs and no other does -----------------------------
  # Board ids, custom field ids, issue-type ids. Written once, read back verbatim.
  # Nothing here is interpreted, so a tracker this plugin has never seen still works.
  # A github board, for example, needs these — every one of them is an id no screen
  # shows you, which is why /pm:setup queries them for you:
  #   project_number, project_owner, project_node_id
  #   project_field_id, project_field_options: {label: option id}
  #   status_field_id,  status_field_options:  {column name: option id}
  #   start_date_field, end_date_field, epic_issue_type
  mirror_extras: {}

  notion:
    body_template: null          # page id whose body is copied into a new record

# --- Daily log (/pm:log, /pm:log-review) ----------------------------------------
# A day's record, assembled from the tracker plus whatever else you name here.
# The tracker itself comes from task.record above and is not repeated.
#
# Two layers. The daily file captures facts and evidence with nobody watching;
# the review turns a period of them into statements you can reuse, and asks you
# the things a file cannot know. Do not try to make the daily run do the second
# job — an unattended agent writing about its own significance is how a log
# fills with sentences nobody can check later.
log:
  enabled: false               # off by default. turn it on where you keep a log
  out:
    dir: "./logs"              # written as <dir>/YYYY/MM/YYYY-MM-DD.md
    front_matter: [date, tasks_mine, tasks_others, meetings, completed, sources]
                               # completed is an index of title and url, not prose
  me:
    tracker_user_id: null      # your id in the record tracker. tells your rows from the team's
  people: {}                   # tracker user id -> display name, for the team section
  sections: [What I did, Meetings, My tasks, Team tasks (reference),
             Decisions, What others said, Evidence, Notes, Follow-ups, Tomorrow]
  empty_line: "- Nothing of note"   # what a section with nothing in it says
  sources:
    calendar: null             # calendar id, or null to skip
    chat_channels: []          # channel ids to read for the day
    notes_channel: null        # where you type notes to yourself — meetings, memos.
                               # a channel only you write in, so nothing has to be tagged
    notes_exclude_apps: []     # user ids of apps that post there on your behalf.
                               # their output is not something you wrote
  backfill:
    business_days: 3           # how many past days to re-check for gaps

  # --- The periodic write-up (/pm:log-review) -----------------------------------
  review:
    out: "./highlights/{YYYY}.md"    # accumulating document. {YYYY} is the period's year
    sections: [Projects, Collaboration and mentoring, Design and documentation,
               What I learned, Feedback received, Company building]
    max_items: 6               # how many to interview about. the rest are listed, not asked
    sentence: xyz              # xyz = accomplished X as measured by Y by doing Z
                               # plain = what was done and what changed
    unknown_metric: "metric unconfirmed"   # stands in where you had no figure to give
