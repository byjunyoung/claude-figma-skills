# =============================================================================
# pm-conventions.yaml — shared config for the pm skills
#
# This file is the single source of truth for the rules. Skill bodies carry
# judgement, never values.
#
# The layers are merged, each overriding the one above. Write only the keys
# you need — anything you leave out falls back to the layer above.
#   1. this file                       bundled defaults (base)
#   2. ~/.claude/pm-conventions.yaml   your shared config
#   3. ./pm-conventions.yaml           per project (wins)
#
# When you don't know a value, write null rather than deleting the key — null
# means "skip that", while deleting brings the default back.
# =============================================================================

meta:
  profile: default          # name stamped on reports, so you know which config ran
  language: auto            # document and report language — auto | en | ko | any BCP-47 tag.
                            # auto follows the language you are talking in

# --- PRD -----------------------------------------------------------------------
prd:
  # Where the document lives. The structure below is identical either way;
  # only publishing differs.
  #   markdown  local files. the default — needs no other tooling
  #   git       writes markdown, then a branch and a PR
  #   notion    Notion pages. requires the notion section to be filled in
  target: markdown

  # --- Structure. The same wherever the doc is published -------------------------
  structure:
    sections: [Overview, Requirements, Linked tasks, Design, Change log]
    overview: [One-line definition, Background, Core value, Goals and scope, User groups]

    # Rows written for each user group. Leave a row as TBD rather than filling
    # it in without evidence.
    user_group_rows: [Account and access, Environment, Primary domains, Key scenario,
                      Pain points, Expectations, Evidence, TBD]

    # Sections inside a feature entry. Behaviour goes in a table (action, given, when, then).
    feature_sections: [Background, Core requirement, Behaviour, States and cases, Rules and exceptions, References]
    policy_sections:  [Background, Rules, References]

    # Fixed rows of the states table. Use '—' when a row does not apply,
    # 'Other' for anything outside the list.
    cases: [Normal, Empty, Loading, Error, No permission]

  # --- Entry properties. Use the words your team actually uses --------------------
  properties:
    type:     [Feature, Policy]
    status:   [Draft, Live, Needs update, Planned, Archived]
    priority: [Core, Important, Nice-to-have]

  # --- Writing rules -------------------------------------------------------------
  # The list that keeps a product doc from turning into an engineering doc.
  # Anything here appearing in the body is rejected at verification. The rule
  # behind it: write *what* is required, and leave *how* to engineering.
  forbidden_terms: [API, endpoint, websocket, polling, payload, token, JWT, OAuth,
                    schema, migration, cache]
  # Only for what genuinely cannot be settled. Attaching this to something the
  # material could have decided fails verification.
  tbd_label:        "TBD"
  assumption_label: "(assumed)"
  emoji:            false        # whether emoji are allowed in the body

  # --- Splitting into domains ----------------------------------------------------
  domains:
    range: [5, 7]                # how many to aim for. they must not overlap
    align_with_design: true      # whether to match the design file's page structure one to one

  # --- target: markdown | git ----------------------------------------------------
  markdown:
    dir: "./docs/prd"            # where documents go
    front_matter: true           # whether to prepend title, status and updated date
    split: product               # product = one file per product / domain = one per domain
  git:
    branch_prefix: "prd/"        # branch prefix when target is git
    open_pr: true

  # --- target: notion ------------------------------------------------------------
  # null skips that lookup or link. Inline database schemas are not changed per document.
  notion:
    template:      null          # page id of the standard format to duplicate
    inline_db:
      users:       null          # user groups
      features:    null          # features and policies
    task_db:       null          # linked tasks
    heading_style: '{color="gray_bg"}'
    reference_docs: []           # existing docs to follow for tone and format

# --- Sources -------------------------------------------------------------------
# Draft quality scales with how much material goes in. Turn off what you don't use.
sources:
  design: true                   # design files
  repo:   true                   # code and design documents
  docs:   true                   # document tools such as Notion
  chat:   true                   # chat history
